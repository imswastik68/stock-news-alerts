# Static confidence lookup table by event type.
#
# These are PRIORS. src/scoring/confidence.py shrinks them toward the hit-rate
# actually measured from tracked outcomes, so they matter most early on and
# progressively less as real data accumulates.
#
# Revised 2026-07-22 against the first real track record (244 alerts, 155 with
# matured 1d outcomes, from evaluate.py against the production DB). The original
# values were subjective guesses and one of them was catastrophically wrong:
#
#   ma_deal was 0.90 -- the HIGHEST prior in the table -- and measured
#   0-for-35 across every horizon (p ~ 4e-6 against a coin flip), avg alpha
#   -3.19% at 3d. Because it was also the top prior, it dominated the
#   "confidence >= 0.80" bucket, which is exactly why that bucket showed a 0%
#   hit rate. It is now 0.45 AND listed as directionally unreliable below.
#
# Measured 3d hit-rates behind the current values (n in brackets):
#   regulatory_legal 75% [8]   other 53% [15]   analyst_rating 50% [6]
#   partnership_contract 29% [34]   earnings_surprise 20% [15]
#   insider_activity 20% [5]   ma_deal 0% [17]
#
# Deliberately NOT set equal to the measured rates: most buckets are n<20, and
# the calibration layer already pulls toward the empirical number. These are
# moved toward reality, not fitted to it.
#
# credit_rating / management_change / insolvency / default_payment were added
# 2026-09-17 with the taxonomy split (src/classification/schema.py) and have NO
# measured record of their own — every filing that would now land in them was
# previously scored under analyst_rating, regulatory_legal or other. They start
# at or just below the "other" prior rather than at a confident number, and the
# calibration layer will move them as outcomes mature.
base_rates:
  regulatory_legal: 0.60
  earnings_surprise: 0.55
  guidance_change: 0.55
  analyst_rating: 0.55
  insolvency: 0.52
  default_payment: 0.52
  macro_sector: 0.50
  credit_rating: 0.50
  insider_activity: 0.48
  partnership_contract: 0.48
  management_change: 0.45
  ma_deal: 0.45
  other: 0.45

# Alerts fire when final confidence >= this threshold. Applies to MEDIA items
# (no exchange category). Can be overridden by ALERT_CONFIDENCE_THRESHOLD.
alert_threshold: 0.70

# Floor for HIGH-impact exchange filings. Until 2026-07-22 a HIGH tier meant
# "always alert" and confidence was never consulted at all -- 94% of alerts took
# that path, so the entire calibration loop was decorative. This is deliberately
# permissive (a genuine catalyst shouldn't need a high directional prior to be
# worth seeing) but it is a real floor: an event type whose measured hit-rate
# decays below it now goes quiet automatically instead of alerting forever.
high_tier_confidence_threshold: 0.35

# Event types with a measured directional record bad enough that we do NOT claim
# a direction for them, regardless of impact tier. These are still ingested,
# classified and stored -- they simply don't produce an alert.
#   ma_deal:          0-for-35 when retired; still 4%/4%/7% at 1d/3d/5d on the
#                     rows that had already matured. Not noise, a systematic miss.
#   insider_activity: 31%/28%/30% at 1d/3d/5d (n=20-26 per horizon) -- below
#                     chance at EVERY horizon, measured 2026-08-11. A promoter
#                     buying or selling turns out to say little about the next
#                     few days' direction.
#   credit_rating:    inherits the analyst_rating retirement below, because that
#                     measurement was taken on THIS population: 43 of the 46
#                     delivered analyst_rating alerts were rating-agency filings.
#                     The bucket also mixed genuine downgrades with
#                     reaffirmations (49 neutral / 43 bullish / 8 bearish), and a
#                     reaffirmation alerted as bullish is a non-event traded as
#                     good news — a plausible source of the negative alpha. The
#                     prompt now forces reaffirmations to materiality < 0.3, so
#                     they stop entering the sample at all. Re-measure once
#                     rating ACTIONS have accumulated on their own; until then
#                     the direction claim stays off. This does mean a genuine
#                     downgrade is stored but not pushed.
#   analyst_rating:   retired 2026-09-17 on a weaker but one-directional case.
#                     Unlike the two above it is not below chance on hit-rate
#                     (54.5% at 1d), so the evidence is AVERAGE ALPHA, which is
#                     negative at every horizon and gets worse with time --
#                     tradable entries only: -0.44% / -1.54% / -1.69% at
#                     1d/3d/5d (n=33/31/29, t = -1.21/-1.88/-1.48). Holdout
#                     agrees: negative avg alpha in BOTH halves. No single cut
#                     clears p<0.05, but six independent cuts all lean the same
#                     way, and it was ~15% of alert volume. Winning slightly
#                     more than half the time while losing more per trade than
#                     it wins is a losing alert, so it stops claiming a
#                     direction. Revisit if a larger sample turns it positive.
#
# management_change, insolvency and default_payment are deliberately NOT here.
# They have no measured record either, but they were previously invisible — the
# model filed them as other/neutral and a neutral direction never alerts — so
# blocking them now would preserve exactly the blind spot the split was made to
# fix. They alert, and get measured.
directionally_unreliable_event_types:
  - ma_deal
  - insider_activity
  - analyst_rating
  - credit_rating

# Suppress a BULLISH alert when the stock has already risen this much over the
# 5 sessions before the filing -- "buy the rumour, sell the news". Measured on
# 371 matured alerts: bullish calls above +8% pre-drift hit 22% with -3.09% avg
# alpha, versus 36% / -0.32% below it, and the effect held out of sample
# (-3.07% in-sample vs -3.12% out-of-sample). See src/scoring/priced_in.py for
# the full evidence. Set to 0 to disable.
priced_in_drift_threshold_pct: 8.0
