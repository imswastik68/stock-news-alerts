name: evaluate-selftest

# One-off, READ-ONLY diagnostic: restore the real production DB (same cache
# key prefix the news-scan loop uses) and run evaluate.py against it, printing
# the actual track record to the job log. Does NOT save the cache back, so it
# can never mutate or race with the live news-scan loop.
on:
  workflow_dispatch: {}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore production DB (read-only)
        uses: actions/cache/restore@v4
        with:
          path: stock_news.db
          key: news-db-nonexistent-key-forces-prefix-match
          restore-keys: news-db-

      # Is BSE's bhavcopy actually reachable FROM A RUNNER? It was verified from
      # a home connection, but Indian exchange sites routinely block datacenter
      # IPs, and this one fails soft — so if it were blocked here, BSE-only
      # scrips would silently stay unpriceable forever with nothing in the logs
      # to say why. Checked explicitly rather than assumed.
      - name: Check BSE bhavcopy reachability from this runner
        continue-on-error: true
        run: |
          python - <<'PY'
          import warnings
          warnings.filterwarnings("ignore")
          from datetime import date, timedelta
          from src.ingestion.bse_bhavcopy import fetch_bhavcopy

          got = None
          for back in range(1, 8):
              d = date.today() - timedelta(days=back)
              parsed = fetch_bhavcopy(d)
              print(f"{d}: {'OK ' + str(len(parsed)) + ' scrips' if parsed else 'no data (weekend/holiday or blocked)'}")
              if parsed and got is None:
                  got = (d, parsed)
          if got is None:
              print("RESULT: FAIL — no bhavcopy retrievable from this runner in the last 7 days")
              raise SystemExit(1)
          d, parsed = got
          # Scrips evaluate.py previously reported as permanently unpriceable.
          for scrip in ["543254", "539016", "544574", "532933"]:
              hit = parsed.get(scrip)
              print(f"  {scrip}: {'close=' + str(hit[0]) if hit else 'ABSENT'}")
          print("RESULT: OK — BSE bhavcopy is reachable from GitHub Actions")
          PY

      # Outcome backlog: how many alerted rows are still waiting on a fill per
      # horizon. Reported before the track record because a large backlog is the
      # difference between "genuinely unpriceable" and "just not fetched yet" —
      # misreading that once already sent us chasing a non-existent BSE-coverage
      # bug when the real cause was track_outcomes()'s batch limit.
      - name: Report outcome-fill backlog
        continue-on-error: true
        run: |
          if [ ! -f stock_news.db ]; then echo "No cached DB found."; exit 0; fi
          python - <<'PY'
          import warnings
          warnings.filterwarnings("ignore")
          from datetime import datetime, timedelta, timezone
          from sqlalchemy import or_, select
          from src.storage.db import get_session
          from src.storage.models import Article
          from src.scoring.outcomes import _HORIZONS, _MAX_TRACK_AGE_DAYS

          session = get_session()
          now = datetime.now(timezone.utc)
          oldest = now - timedelta(days=_MAX_TRACK_AGE_DAYS)
          for col_name, idx_col_name, _tdays, min_age in _HORIZONS:
              col = getattr(Article, col_name)
              idx_col = getattr(Article, idx_col_name)
              stmt = select(Article.id).where(
                  Article.alert_sent == True,  # noqa: E712
                  Article.published_at <= now - timedelta(days=min_age),
                  Article.published_at >= oldest,
                  or_(col.is_(None), idx_col.is_(None)),
              )
              n = len(list(session.execute(stmt)))
              print(f"backlog for {col_name}/{idx_col_name}: {n} row(s) eligible for a fill")
          session.close()
          PY

      # The whole-period report mixes alerts sent BEFORE the 2026-07-22 gate fix
      # with those sent after, so it can't answer "did the fix work". This splits
      # on send time and also breaks down the confidence buckets, which is the
      # only way to see whether the old confidence inversion is still live or is
      # just pre-fix rows maturing.
      - name: Pre/post-fix split and confidence-bucket composition
        continue-on-error: true
        run: |
          if [ ! -f stock_news.db ]; then echo "No cached DB found."; exit 0; fi
          python - <<'PY'
          import warnings
          warnings.filterwarnings("ignore")
          from datetime import datetime, timezone
          from sqlalchemy import select
          from src.storage.db import get_session
          from src.storage.models import Article
          from evaluate import wilson_ci

          FIX = datetime(2026, 7, 22, 5, 58, tzinfo=timezone.utc)  # dedup+gate live
          s = get_session()

          def hit(d, r):
              return (d == "bullish" and r > 0) or (d == "bearish" and r < 0)

          for horizon in ("ret_1d", "ret_3d"):
              col = getattr(Article, horizon)
              idx = getattr(Article, f"idx_{horizon}")
              rows = list(s.execute(select(
                  Article.created_at, Article.direction, Article.confidence,
                  Article.event_type, col, idx,
              ).where(
                  Article.alert_sent == True, col.is_not(None),
                  Article.direction != "neutral",
              )))
              print(f"\n===== {horizon} =====")
              for label, sel in (
                  ("PRE-fix ", [r for r in rows if (r[0].replace(tzinfo=timezone.utc) if r[0].tzinfo is None else r[0]) < FIX]),
                  ("POST-fix", [r for r in rows if (r[0].replace(tzinfo=timezone.utc) if r[0].tzinfo is None else r[0]) >= FIX]),
              ):
                  if not sel:
                      print(f"{label}: no rows"); continue
                  n = len(sel)
                  raw = sum(1 for r in sel if hit(r[1], r[4]))
                  al = [(r[1], r[4] - r[5]) for r in sel if r[5] is not None]
                  ah = sum(1 for d, a in al if hit(d, a))
                  lo, hi = wilson_ci(ah, len(al)) if al else (0, 1)
                  avg_alpha = sum(a for _, a in al) / len(al) if al else 0.0
                  print(f"{label}: n={n:<4} raw={raw/n:.0%}  alpha={ah/len(al):.0%} [{lo:.0%}-{hi:.0%}]  avg_alpha={avg_alpha:+.2f}%")

          # What is actually sitting in the high-confidence buckets?
          print("\n===== conf>=0.70 composition (ret_1d) =====")
          rows = list(s.execute(select(
              Article.created_at, Article.event_type, Article.confidence,
              Article.direction, Article.ret_1d,
          ).where(
              Article.alert_sent == True, Article.ret_1d.is_not(None),
              Article.direction != "neutral", Article.confidence >= 0.70,
          )))
          from collections import Counter
          c = Counter()
          for created, et, conf, d, r in rows:
              created = created.replace(tzinfo=timezone.utc) if created.tzinfo is None else created
              c[(et, "post" if created >= FIX else "pre")] += 1
          for (et, era), k in sorted(c.items(), key=lambda x: -x[1]):
              print(f"  {et:<24} {era:<5} {k}")
          s.close()
          PY

      # Upload the restored DB so hypotheses can be backtested locally instead of
      # through a ~2-minute CI round-trip each iteration. Read-only: this job
      # never saves the cache back, so it cannot race the live news-scan loop.
      - name: Upload production DB for local analysis
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-db
          path: stock_news.db
          retention-days: 3
          if-no-files-found: warn

      - name: Run evaluate.py at all three horizons
        run: |
          if [ ! -f stock_news.db ]; then
            echo "No cached DB found."
            exit 0
          fi
          ls -la stock_news.db
          echo "=== ret_1d ==="
          python evaluate.py --horizon ret_1d
          echo ""
          echo "=== ret_3d ==="
          python evaluate.py --horizon ret_3d
          echo ""
          echo "=== ret_5d ==="
          python evaluate.py --horizon ret_5d
